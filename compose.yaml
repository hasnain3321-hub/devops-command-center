services:
  web:
    build: .
    container_name: portfolio-web
    ports:
      - "8087:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost"]
      interval: 30s
      timeout: 5s
      retries: 3

  client:
    image: alpine:latest
    container_name: portfolio-client
    command: sh -c "while true; do sleep 3600; done"
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
